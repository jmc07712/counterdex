# Local Postgres for development. Production uses Neon (Postgres 17); tests start their own.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: counterdex
      POSTGRES_PASSWORD: counterdex
      POSTGRES_DB: counterdex
    ports:
      # Localhost only: the credentials above are public, so never expose this on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterdex -d counterdex"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
