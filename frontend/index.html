<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Build Pokémon teams of six and find the team that counters them." />
    <title>Counterdex</title>
    <script>
      // Apply the saved theme (or the OS setting) before first paint so dark mode doesn't flash.
      // Keep the key in sync with THEME_STORAGE_KEY in src/lib/theme.ts.
      try {
        var saved = localStorage.getItem('counterdex-theme')
        if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
