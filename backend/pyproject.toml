[project]
name = "counterdex-api"
version = "0.1.0"
description = "Counterdex API: the backend for a Pokémon team builder"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Tests may only reach localhost (the throwaway Postgres container) and Docker's local socket
# (to start it); any other network call fails the test.
addopts = ["--allow-hosts=localhost,127.0.0.1,::1", "--allow-unix-socket"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "FAST", "C4", "PTH", "RET"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.alembic]
script_location = "app:migrations"
# Lets env.py import the app package when the CLI runs from backend/.
prepend_sys_path = ["."]
# Date-prefixed names keep migration files listed in the order they were created.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
# Generated migrations are linted and formatted like hand-written code.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

# Architecture rules, checked by `uv run lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domains build on core, never the other way round"
type = "layers"
layers = ["app.sync : app.teams : app.counter", "app.pokemon : app.accounts", "app.core"]

[[tool.importlinter.contracts]]
name = "Domains and core know nothing about entrypoints or the web framework"
type = "forbidden"
source_modules = [
    "app.core",
    "app.accounts",
    "app.pokemon",
    "app.sync",
    "app.teams",
    "app.counter",
]
forbidden_modules = ["app.api", "app.jobs", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Entrypoints are independent of each other"
type = "independence"
modules = ["app.api", "app.jobs"]

[tool.uv]
# Dependencies must be out for about two weeks before we take them. pycparser (via pwdlib ->
# argon2-cffi -> argon2-cffi-bindings -> cffi) released 3.1 on 2026-10-08; lift this once it's
# settled.
constraint-dependencies = ["pycparser<3.1"]
